<script>
(function () {
  'use strict';
  var m = /[?&]id=([^&]*)/.exec(window.location.search);
  var id = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  var to = (typeof LEGACY_GUIDE_ROUTES !== 'undefined' && LEGACY_GUIDE_ROUTES[id]) || 'resources.html';
  window.location.replace(to + window.location.hash);
})();
</script>
